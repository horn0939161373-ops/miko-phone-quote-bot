name: 米可手機報價通知

on:
  schedule:
    # 每小時自動執行一次。2026-08-15 已重新核對 GitHub Actions：
    # schedule 觸發正常，近期自動排程持續成功執行。
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: phone-quote
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run phone quote script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node src/index.js

      - name: Commit updated data and state
        # 就算上面那個 step 失敗（例如抓取失敗），也要照樣把 docs/status.json
        # 裡記錄的失敗原因 commit 上去，後台儀表板的「抓取執行紀錄」才看得到
        # 這次失敗，而不是整批資料都不會更新。
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/phones.json docs/history.json docs/status.json state/last-prices.json
          git diff --cached --quiet && exit 0

          git commit -m "chore: 更新米可手機報價資料 [skip ci]"
          # 手動觸發/排程或人在 GitHub 同時改檔時，push 可能遇到遠端新 commit。
          # rebase 的 -X theirs 在 rebase 語意下保留「本輪正在重放的資料檔」，
          # 避免 status/state JSON 衝突把整個 job 卡死。
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 被拒絕（第 $i 次），rebase 到最新 main 後重試..."
            git pull --rebase -X theirs origin main
          done
          echo "重試 5 次後仍 push 失敗" >&2
          exit 1
